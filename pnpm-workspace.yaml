packages:
  # devkit 件（工作台侧）与 repo-kit（仓侧工具包）同居一仓：模板薄壳与守卫工厂
  # 是「两处正本必须同步动」的耦合——一个 commit 改两边、一趟 release 发两包
  # cordis 件与普通 npm 包分区住（base-plugins/ui-plugins/block-note 同一习俗）
  - plugins/*
  - packages/*
  # 文档站：自己的依赖树，不进根 check
  - docs-site

# peer 对不上就当场报错。第三方包之间的不匹配用 peerDependencyRules 在这儿点名放行，别关严格
strictPeerDependencies: true

allowBuilds:
  # docs-site 那半拖来的；件的构建是一次性的
  '@parcel/watcher': false
  esbuild: true
